spring:
  application:
    name: citypulse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citypulse}
    username: ${DB_USERNAME:citypulse}
    password: ${DB_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
citypulse:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@citypulse.vn}
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
